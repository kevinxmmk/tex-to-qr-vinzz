
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costume QR Code by Vinzz</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        :root {
            --primary: #ff0055;
            --primary-glow: rgba(255, 0, 85, 0.4);
            --secondary: #7928ca;
            --bg-dark: #0a0a0c;
            --card-bg: rgba(22, 22, 29, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        .background-decor {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .circle-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--primary) 0%, rgba(0,0,0,0) 70%);
            opacity: 0.3;
            filter: blur(60px);
        }

        .circle-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--secondary) 0%, rgba(0,0,0,0) 70%);
            opacity: 0.35;
            filter: blur(60px);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 850px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            box-shadow: 0 8px 25px var(--primary-glow);
            font-size: 26px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(180deg, #FFFFFF 0%, #A1A1AA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(10, 10, 12, 0.6);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .color-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .color-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(10, 10, 12, 0.6);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 12px;
        }

        input[type="color"] {
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }

        .preview-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 12, 0.4);
            border: 1px dashed var(--border-color);
            border-radius: 20px;
            padding: 20px;
        }

        #canvas-container {
            background: #ffffff;
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-download {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), #e0004c);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--primary-glow);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 0, 85, 0.6);
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        footer strong {
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="background-decor">
    <div class="circle-1"></div>
    <div class="circle-2"></div>
</div>

<div class="container">
    <div class="card">
        <div class="header">
            <div class="brand-logo">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <h1>Costume QR Code by Vinzz</h1>
            <p class="subtitle">Buat QR Code unik dengan gaya, warna & logo kustom</p>
        </div>

        <div class="grid-layout">
            <div class="controls">
                <div class="form-group">
                    <label><i class="fa-solid fa-link"></i> Isi Teks / Link URL</label>
                    <input type="text" id="qrText" value="https://google.com" placeholder="Masukkan URL atau teks..." oninput="updateQR()">
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-palette"></i> Warna QR & Background</label>
                    <div class="color-inputs">
                        <div class="color-box">
                            <input type="color" id="qrColor" value="#ff0055" onchange="updateQR()">
                            <span style="font-size: 12px; color: var(--text-muted);">Titik QR</span>
                        </div>
                        <div class="color-box">
                            <input type="color" id="bgColor" value="#ffffff" onchange="updateQR()">
                            <span style="font-size: 12px; color: var(--text-muted);">Background</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-shapes"></i> Bentuk Titik QR</label>
                    <select id="dotsStyle" onchange="updateQR()">
                        <option value="square">Kotak (Klasik)</option>
                        <option value="dots">Bintik-bintik (Dots)</option>
                        <option value="rounded" selected>Membulat (Rounded)</option>
                        <option value="classy">Classy</option>
                        <option value="extra-rounded">Extra Membulat</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-border-top-left"></i> Bentuk Sudut (Corner Eyes)</label>
                    <select id="cornersStyle" onchange="updateQR()">
                        <option value="square">Kotak</option>
                        <option value="dot">Titik (Dot)</option>
                        <option value="extra-rounded" selected>Membulat (Rounded)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-image"></i> Gambar Logo Tengah</label>
                    <input type="file" id="logoInput" accept="image/*" onchange="handleLogoUpload(event)">
                </div>
            </div>

            <div class="preview-box">
                <div id="canvas-container"></div>
                <button class="btn-download" onclick="downloadQR()">
                    <i class="fa-solid fa-download"></i> Unduh Gambar QR
                </button>
            </div>
        </div>

        <footer>
            Web ini dibuat oleh <strong>vinzz kedce</strong>
        </footer>
    </div>
</div>

<script>
let logoUrl = "";

const qrCode = new QRCodeStyling({
    width: 220,
    height: 220,
    type: "canvas",
    data: "https://google.com",
    image: "",
    dotsOptions: {
        color: "#ff0055",
        type: "rounded"
    },
    backgroundOptions: {
        color: "#ffffff",
    },
    cornersSquareOptions: {
        color: "#ff0055",
        type: "extra-rounded"
    },
    imageOptions: {
        crossOrigin: "anonymous",
        margin: 4,
        imageSize: 0.3
    }
});

qrCode.append(document.getElementById("canvas-container"));

function updateQR() {
    const text = document.getElementById("qrText").value.trim() || "https://google.com";
    const qrColor = document.getElementById("qrColor").value;
    const bgColor = document.getElementById("bgColor").value;
    const dotsStyle = document.getElementById("dotsStyle").value;
    const cornersStyle = document.getElementById("cornersStyle").value;

    qrCode.update({
        data: text,
        image: logoUrl,
        dotsOptions: {
            color: qrColor,
            type: dotsStyle
        },
        backgroundOptions: {
            color: bgColor,
        },
        cornersSquareOptions: {
            color: qrColor,
            type: cornersStyle
        }
    });
}

function handleLogoUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
            logoUrl = e.target.result;
            updateQR();
        };
        reader.readAsDataURL(file);
    }
}

function downloadQR() {
    qrCode.download({ name: "qrcode-vinzz", extension: "png" });
}
</script>

</body>
</html>
